# This workflow checks if it's time to generate the next beta relnotes.
# And if so, it generates a draft and opens an issue to notify the team.

name: Generate beta relnotes

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Force generating the notes for this version (e.g. 156), ignoring the date window'
        required: false
        type: string
  schedule:
    # once a day
    - cron: '0 0 * * *'

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install
          npx playwright install

      - name: Generate release notes
        run: |
          cd scripts
          actor=${{ github.actor }} token=${{ secrets.GITHUB_TOKEN }} node web-platform-release-notes.js ${{ inputs.version && format('--version={0}', inputs.version) || '' }}
